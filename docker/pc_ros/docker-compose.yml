services:
  pc_ros:
    build:
      context: ../..
      dockerfile: docker/pc_ros/Dockerfile
    platform: linux/amd64
    network_mode: "host"
    init: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ROS_LOCALHOST_ONLY: "0"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics,video
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    devices:
      - "${JOY_DEVICE:-/dev/input/js0}:/dev/input/js0"
    volumes:
      - ../../src:/ros2_ws/src:ro
      - ros_build:/ros2_ws/build
      - ros_install:/ros2_ws/install
      - ros_log:/ros2_ws/log
      - ../../bags:/data/bags

volumes:
  ros_build:
  ros_install:
  ros_log:
